<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>عروض زواج حقيقية 💍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #f5e6f0, #fce4ec);
    color: #392433;
}

.card {
    width: 100%;
    max-width: 410px;
    background: #ffffff;
    padding: 38px 25px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 12px 45px rgba(150, 50, 100, 0.12);
}

.icon {
    width: 85px;
    height: 85px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #fff0f5;
    font-size: 43px;
}

h1 {
    font-size: 25px;
    margin: 0 0 15px;
    color: #a83267;
}

.description {
    font-size: 15px;
    line-height: 2;
    color: #776775;
    margin-bottom: 25px;
}

.info {
    background: #fff5f8;
    border: 1px solid #f8dce8;
    border-radius: 13px;
    padding: 13px;
    font-size: 13px;
    color: #87516c;
    margin-bottom: 25px;
}

.button {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 13px;
    background: linear-gradient(135deg, #c13d78, #922653);
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(173, 45, 100, 0.22);
    transition: 0.2s;
}

.button:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 22px rgba(173, 45, 100, 0.3);
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #a394a0;
}
</style>
</head>

<body>

<main class="card">

    <div class="icon">💍</div>

    <h1>عروض زواج حقيقية</h1>

    <p class="description">
        اكتشف عروض الزواج والتعارف، وتعرّف على أشخاص جدد
        يبحثون عن شريك الحياة وبناء علاقة جادة.
    </p>

    <div class="info">
        سيتم توجيهك إلى صفحة العرض عند الضغط على الزر.
    </div>

    <a class="button"
       href="https://www.profitableratecpmnetwork.com/mg92sq641i?key=95386702a1b6bd803f7f0299c5204a84"
       target="_blank"
       rel="nofollow sponsored noopener">
       متابعة إلى العرض ←
    </a>

    <div class="footer">
        نتمنى لك التوفيق 💗
    </div>

</main>

</body>
</html>
