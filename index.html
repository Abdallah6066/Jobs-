<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Adults Only</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:16px;box-sizing:border-box}
  .box{max-width:420px;width:100%;background:#1c1c1c;border-radius:16px;padding:28px 22px;text-align:center}
  h1{font-size:22px;margin:0 0 12px}
  p{color:#bbb;line-height:1.8;margin:0 0 22px;font-size:15px}
  a{display:block;padding:14px;border-radius:10px;text-decoration:none;font-size:16px;margin-top:10px}
  .yes{background:#e50914;color:#fff}
  .no{background:#333;color:#ddd}
</style>
</head>
<body>
<div class="box">
  <h1 id="t"></h1>
  <p id="d"></p>
  <a class="yes" id="y" href="https://massive-hall.com/HSamGp"></a>
  <a class="no" id="n" href="https://www.google.com/"></a>
</div>
<script>
var text = {
  ar: {
    title: "تنبيه: محتوى للبالغين",
    h: "🔞 محتوى للبالغين فقط",
    d: "يحتوي الموقع التالي على محتوى مخصص لمن بلغ 18 عاماً فأكثر. بالضغط على \"أنا أكبر من 18\" فإنك تُقرّ بأن عمرك 18 عاماً أو أكثر.",
    y: "أنا أكبر من 18 عاماً — دخول",
    n: "عمري أقل من 18 — خروج"
  },
  en: {
    title: "Adults Only",
    h: "🔞 Adults Only",
    d: "The following site contains content intended for people aged 18 or older. By clicking \"I am 18 or older\", you confirm that you are at least 18 years old.",
    y: "I am 18 or older — Enter",
    n: "I am under 18 — Exit"
  }
};
var lang = (navigator.language || "en").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
var s = text[lang];
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
document.title = s.title;
document.getElementById("t").textContent = s.h;
document.getElementById("d").textContent = s.d;
document.getElementById("y").textContent = s.y;
document.getElementById("n").textContent = s.n;
</script>
</body>
</html>
